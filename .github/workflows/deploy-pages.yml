# deploy-pages.yml
# Deploys the PGP for Outlook add-in web files to GitHub Pages on every push
# to the main / master branch, and generates the PGP-for-Outlook.zip deployment
# package for the new Outlook / unified manifest.
#
# The build job runs the Vitest suite with coverage (npm run test:coverage)
# before packaging/uploading anything. Since the deploy job depends on build
# (needs: build), a failing test run blocks deployment automatically — no
# extra wiring required. The coverage report itself is uploaded as a workflow
# artifact for visibility only — there's no coverage threshold gate, since the
# suite deliberately doesn't cover the Office.js UI entry points yet (see
# CLAUDE.md's test-suite section), which would make a hard percentage
# threshold misleading.
#
# manifest/manifest.xml and manifest/manifest.json already hardcode the
# production URLs (https://pgp-outlook.ruscaltech.com/...) directly — there is
# no "~remoteAppUrl" placeholder to substitute. Self-hosters should edit the
# URLs in both manifest files directly to point at their own Pages URL (e.g.
# https://<org>.github.io/<repo>/), then commit and push.
#
# CORS note:
#   GitHub Pages serves files with permissive CORS headers, which is
#   required for Office.js to load the task-pane iframes.  No extra
#   configuration is needed.
#
# "latest" manifest.xml release:
#   Whenever a push to main/master actually changes manifest/manifest.xml (and
#   tests pass), the build job publishes/updates a GitHub Release tagged
#   "latest" containing just that file. Its asset URL
#   (https://github.com/<org>/<repo>/releases/latest/download/manifest.xml)
#   stays stable across every update, so IT admins can import it once into
#   Exchange Online / M365 admin center's Integrated Apps and never touch it
#   again. This is separate from the versioned v*-tag release below, which
#   bundles manifest.json + icons instead.
#
# Permissions required:
#   This workflow uses the GITHUB_TOKEN that is automatically provided by
#   Actions.  The token needs "contents: write" (to publish/update releases),
#   "pages: write", and "id-token: write" scopes (granted below).  No personal
#   access tokens are required.

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  # Allow manual re-deployment from the Actions tab
  workflow_dispatch:

# Only one deployment at a time; cancel in-progress runs on new push
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so paths-filter can diff manifest.xml against the prior commit

      - name: Check if manifest.xml changed
        id: manifest-changed
        uses: dorny/paths-filter@v3
        with:
          filters: |
            manifest:
              - 'manifest/manifest.xml'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: warn

      - name: Build deployment ZIP (unified manifest)
        run: bash manifest/build-package.sh

      # The web app lives in "web/".
      # We upload that directory as the Pages artifact so its contents
      # appear at the root of the Pages URL (no subdirectory prefix needed).
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "web"

      - name: Upload ZIP as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PGP-for-Outlook
          path: manifest/PGP-for-Outlook.zip
          if-no-files-found: error

      # Attach the ZIP to a GitHub release when a version tag (v*) is pushed
      - name: Attach ZIP to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: manifest/PGP-for-Outlook.zip

      # Rolling "latest" release: only when this push actually changed
      # manifest.xml (avoids publishing a no-op release for every web/-only
      # or tests/-only change to main). softprops/action-gh-release updates
      # the existing "latest" release in place (moves the tag, replaces the
      # asset) rather than failing if one already exists.
      - name: Publish/update "latest" manifest.xml release
        if: |
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
          steps.manifest-changed.outputs.manifest == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest manifest.xml
          make_latest: true
          prerelease: false
          files: manifest/manifest.xml
          body: |
            Always-current `manifest.xml` for org-wide deployment via Exchange Online / M365 admin center's Integrated Apps (import by URL).
            Stable download link: https://github.com/${{ github.repository }}/releases/latest/download/manifest.xml
            Published from commit ${{ github.sha }}.

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
