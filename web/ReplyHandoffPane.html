<!-- Dedicated minimal pane for #22's classic-Windows reply-handoff path: opened
     automatically (via an InsightMessage notification's ShowTaskPane action,
     see Functions/ReplyHandoffRuntime.classic.js) instead of the full
     Encrypt/Decrypt pane, so the user isn't shown unrelated recipient/sign
     UI for what should be a one-click, self-closing action. See
     ReplyHandoffPane.js for what it actually does. -->
<div class="pgp-pane" id="app" style="padding:16px;">
  <div id="status-bar" class="pgp-alert pgp-alert--info">Inserting decrypted reply&hellip;</div>
</div>
